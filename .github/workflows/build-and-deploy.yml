name: Build And Deploy SBI Release

on:
  workflow_dispatch:
  push:
    branches:
      - test-chat

env:
  CLOUD_SSH_HOST: 203.0.113.10
  CLOUD_SSH_PORT: "22"
  CLOUD_SSH_USER: root
  CLOUD_DEPLOY_PATH: /opt/sbi-chatbot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build release artifact
        run: python scripts/build_release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbi-release
          path: |
            dist/sbi-release.zip
            dist/sbi-release.tar.gz

      - name: Configure SSH
        if: ${{ secrets.CLOUD_SSH_PRIVATE_KEY != '' && env.CLOUD_SSH_HOST != '203.0.113.10' }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.CLOUD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${CLOUD_SSH_PORT}" "${CLOUD_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release archive
        if: ${{ secrets.CLOUD_SSH_PRIVATE_KEY != '' && env.CLOUD_SSH_HOST != '203.0.113.10' }}
        run: |
          scp -P "${CLOUD_SSH_PORT}" dist/sbi-release.tar.gz "${CLOUD_SSH_USER}@${CLOUD_SSH_HOST}:/tmp/sbi-release.tar.gz"

      - name: Deploy release on server
        if: ${{ secrets.CLOUD_SSH_PRIVATE_KEY != '' && env.CLOUD_SSH_HOST != '203.0.113.10' }}
        run: |
          ssh -p "${CLOUD_SSH_PORT}" "${CLOUD_SSH_USER}@${CLOUD_SSH_HOST}" "\
            set -euo pipefail && \
            mkdir -p '${CLOUD_DEPLOY_PATH}' && \
            rm -rf '${CLOUD_DEPLOY_PATH}/current' && \
            mkdir -p '${CLOUD_DEPLOY_PATH}/current' && \
            tar -xzf /tmp/sbi-release.tar.gz -C '${CLOUD_DEPLOY_PATH}/current' --strip-components=1 && \
            cd '${CLOUD_DEPLOY_PATH}/current' && \
            bash deploy/install_release.sh && \
            bash deploy/restart_app.sh"
